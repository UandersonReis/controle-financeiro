<style>
:root{
 --bg:#07111d;--side:#08131f;--card:#0f1e2e;--card2:#102338;--line:#22394e;
 --txt:#f4f7fb;--muted:#92a8bb;--blue:#3aa2f5;--green:#35d29d;--yellow:#f4c44f;
 --red:#fb6173;--violet:#a678ef;--orange:#f5a94f;--cyan:#68d1ea
}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.4 Inter,Segoe UI,Arial,sans-serif}
aside{position:fixed;inset:0 auto 0 0;width:220px;background:var(--side);border-right:1px solid var(--line);padding:22px 12px;z-index:5}
.brand{font-size:20px;font-weight:800;padding:0 10px 24px}.brand .bars{color:var(--green);letter-spacing:-3px;margin-right:8px}
.brand small{display:block;font-size:11px;color:var(--muted);font-weight:400;line-height:1.25;margin-top:4px}
nav button{display:block;width:100%;border:0;background:transparent;color:#b7c9d8;text-align:left;padding:11px 12px;border-radius:10px;margin:3px 0;cursor:pointer;font-size:13px}
nav button:hover,nav button.active{background:#173a5e;color:#fff}
.profile{position:absolute;bottom:18px;padding:10px;color:#a3b5c4}.profile b{color:#fff}.quote{font-style:italic;color:#6f879c;font-size:12px;margin-top:8px}
main{margin-left:220px;padding:24px;max-width:1600px}
.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:18px}.hello h1{font-size:30px;margin:0}.hello p{margin:3px 0;color:var(--muted)}
.controls{display:flex;gap:10px;align-items:center}.quoteCard{background:linear-gradient(135deg,#123629,#0f332f);border:1px solid #1c5c4c;border-radius:12px;padding:12px 16px;color:#61dba8;font-style:italic;max-width:335px}
select,input,textarea{background:#091725;color:#fff;border:1px solid var(--line);border-radius:8px;padding:9px}
button.btn{border:0;border-radius:8px;padding:9px 13px;background:#197bc1;color:white;font-weight:700;cursor:pointer}.btn.green{background:#18845e}.btn.red{background:#923a47}.btn.ghost{background:#193047}.btn.yellow{background:#8e6b20}
.cards4{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin:18px 0}.card{background:linear-gradient(145deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:13px;padding:15px;min-width:0}
.metric{display:flex;align-items:center;gap:12px}.ico{width:48px;height:48px;border-radius:10px;display:grid;place-items:center;font-size:23px;font-weight:800}.ig{background:#25a972}.ir{background:#bd4c5f}.ib{background:#2c83c4}.iv{background:#7556ae}
.label{color:#a6bac9}.value{font-size:23px;font-weight:800}.sub{font-size:11px;color:var(--muted)}.pos{color:var(--green)}.neg{color:var(--red)}.warn{color:var(--yellow)}
.grid2{display:grid;grid-template-columns:1.2fr .8fr;gap:13px}.grid22{display:grid;grid-template-columns:.9fr 1.1fr;gap:13px;margin-top:13px}.grid3{display:grid;grid-template-columns:1.1fr .7fr .9fr;gap:13px;margin-top:13px}
.card h3{margin:0 0 13px;font-size:16px}.rowTitle{display:flex;justify-content:space-between;align-items:center;gap:8px}.muted{color:var(--muted)}
.donutWrap{display:grid;grid-template-columns:190px 1fr;gap:24px;align-items:center}.donut{width:180px;height:180px;border-radius:50%;position:relative;margin:auto}.donut:after{content:"";position:absolute;inset:34px;background:#0e1d2b;border-radius:50%}.donutText{position:absolute;z-index:2;inset:0;display:grid;place-items:center;text-align:center;font-weight:800;font-size:18px}.legendRow{display:grid;grid-template-columns:minmax(180px,1fr) 64px 105px;gap:10px;padding:7px 0;border-bottom:1px solid #182d3f}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px}
.chart{height:225px;position:relative;padding:8px 4px}.chart svg{width:100%;height:100%;overflow:visible}.axis{stroke:#244158;stroke-width:1}.line{fill:none;stroke:var(--green);stroke-width:3}.expenseLine{fill:none;stroke:var(--blue);stroke-width:3}.point{fill:var(--green)}.expensePoint{fill:var(--blue)}
table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:8px;border-bottom:1px solid #1d3448;text-align:left}th{color:#9db1c2;font-weight:500}.scroll{overflow:auto}.tag{display:inline-block;padding:3px 7px;border-radius:99px;background:#17334a;white-space:nowrap}
.msg{padding:10px 11px;background:#132a3d;border-radius:9px;margin:7px 0}.msg.yellow{border-left:3px solid var(--yellow)}.msg.green{border-left:3px solid var(--green)}.msg.red{border-left:3px solid var(--red)}
.cardAccount{padding:12px;border:1px solid #25425a;border-radius:10px;margin:8px 0}.progress{height:8px;background:#1b3042;border-radius:99px;overflow:hidden;margin-top:8px}.progress i{display:block;height:100%;background:var(--blue)}
.riskGauge{width:210px;height:105px;margin:14px auto;overflow:hidden;position:relative}.riskGauge .arc{width:210px;height:210px;border-radius:50%;background:conic-gradient(from 270deg,var(--yellow) 0 40%,#33495d 40% 50%,transparent 50%);position:absolute}.riskGauge .inner{position:absolute;width:158px;height:158px;left:26px;top:26px;background:var(--card);border-radius:50%}.riskGauge .txt{position:absolute;inset:45px 0 0;text-align:center;font-weight:800;font-size:20px;color:var(--yellow)}
.page{display:none}.page.active{display:block}.sectionTitle{font-size:28px;margin:0 0 16px}.toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.formgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.formgrid5{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}.wide{width:100%}
.editInput{width:100%;min-width:90px}.check{width:auto}.actions{display:flex;gap:6px}.kpiCompare{font-size:11px;margin-top:3px}
.empty{padding:28px;text-align:center;color:var(--muted)}
.modal{display:none;position:fixed;inset:0;background:#0009;z-index:20;place-items:center}.modal.open{display:grid}.modalBox{width:min(760px,92vw);max-height:86vh;overflow:auto;background:#0d1d2c;border:1px solid var(--line);border-radius:14px;padding:18px}

.bankHead{display:flex;align-items:center;gap:10px}
.bankIcon{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-weight:900;font-size:13px;flex:0 0 auto}
.bankBradesco{background:linear-gradient(135deg,#d61f3c,#8b1027);color:#fff}
.bankItau{background:linear-gradient(135deg,#ff7a00 0 38%,#0f4aa6 38% 100%);color:#fff}
.bankGeneric{background:#29445a;color:#fff}
.categoryBars{margin-top:8px}
.catBarRow{display:grid;grid-template-columns:minmax(160px,1fr) 95px;gap:12px;align-items:center;margin:9px 0}
.catBarName{display:flex;justify-content:space-between;gap:8px;font-size:12px}
.catBarTrack{height:9px;background:#1a3042;border-radius:99px;overflow:hidden;margin-top:5px}
.catBarFill{height:100%;border-radius:99px}
.competenceTag{display:inline-block;padding:3px 7px;border-radius:999px;background:#20384c;color:#cce2f3;font-size:11px}


.incomeList{display:grid;gap:8px;margin-top:10px}
.incomeItem{display:grid;grid-template-columns:1.4fr .7fr .6fr .45fr;gap:8px;align-items:center;padding:10px;background:#132a3d;border-radius:9px}
.smallBadge{display:inline-block;padding:3px 7px;border-radius:999px;background:#1d3850;font-size:11px;color:#cfe2f2}
.noData{opacity:.8;text-align:center;padding:22px}

@media(max-width:1050px){.cards4,.grid2,.grid22,.grid3,.donutWrap,.formgrid,.formgrid5{grid-template-columns:1fr 1fr}.quoteCard{display:none}}
@media(max-width:760px){aside{position:static;width:auto}.profile{display:none}main{margin:0}.cards4,.grid2,.grid22,.grid3,.donutWrap,.formgrid,.formgrid5{grid-template-columns:1fr}.topbar{display:block}.controls{margin-top:12px}}

/* SAFE MOBILE V13 */
@media(max-width:768px){
 body{padding-bottom:74px}
 aside{position:fixed;left:0;right:0;top:auto;bottom:0;width:100%;height:66px;padding:5px 7px;background:#08131ff2;border-right:0;border-top:1px solid var(--line);z-index:50}
 .brand,.profile{display:none}
 nav{display:flex;overflow-x:auto;gap:3px}
 nav button{min-width:76px;width:auto;font-size:10px;text-align:center;padding:7px 8px}
 main{margin-left:0;padding:14px 12px 84px}
 .topbar{display:block}.quoteCard{display:none}
 .controls{display:grid;grid-template-columns:1fr 1fr;margin-top:10px}
 .cards4{grid-template-columns:1fr 1fr;gap:9px}
 .grid2,.grid22,.grid3,.donutWrap,.formgrid,.formgrid5{grid-template-columns:1fr}
 .categoryBars{display:none}.chart{height:180px}
 table{min-width:720px;font-size:11px}.scroll{overflow-x:auto}
 .incomeItem{grid-template-columns:1fr}
}
@media(max-width:420px){.cards4{grid-template-columns:1fr}}


@media(max-width:700px){
 #faturasPage .card>div[style*="grid-template-columns"]{grid-template-columns:1fr!important}
 #faturasPage input[type=file],#faturasPage .btn{width:100%}
}
</style>

<body>
<aside>
 <div class="brand"><span class="bars">▮▮▮</span> Meu Financeiro
  <small>Seu dinheiro. Suas escolhas.<br>Um futuro maior.</small>
 </div>
 <nav id="nav"></nav>
 <div class="profile"><b>Controle Financeiro</b><br><span class="muted">Uso pessoal</span><div class="quote">“Organize hoje,<br>planeje melhor amanhã.”</div></div>
</aside>

<main>
 <section id="dashboardPage" class="page active"></section>
 <section id="lancamentosPage" class="page"></section>
 <section id="faturasPage" class="page"></section>
 <section id="fixasPage" class="page"></section>
 <section id="parcelasPage" class="page"></section>
 <section id="relatoriosPage" class="page"></section>
 <section id="riscoPage" class="page"></section>
 <section id="sugestoesPage" class="page"></section>
 <section id="configPage" class="page"></section>
</main>

<div id="modal" class="modal"><div id="modalBox" class="modalBox"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs" type="module"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
window.addEventListener("error",e=>{ if(String(e.message||"").includes("pdf")) console.warn(e); });
</script>
<script>
let D=null, preview=[], selectedMonth=null, selectedYear=null, currentPage="dashboard";
const DEFAULT_DATA={"salary":0.0,"fixed":[],"categories":["Saúde","Transporte","Alimentação/Despesas da Casa","Lazer","Vestuário","Educação","Moradia/Contas Fixas","Assinaturas","Compras/Casa","Outros"],"cards":[],"transactions":[],"rules":{},"income_sources":[{"id":"r1","descricao":"Salário fixo","valor":0.0,"tipo":"Fixa","ativa":true}],"control_start":"2026-09"};
const MONTHS=["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];
const COLORS=["#3aa2f5","#f5b24f","#fb6173","#a678ef","#35d29d","#68d1ea","#7d8fa1","#f27bb5","#8bd66f","#d7a75a"];
const PAGES=[
 ["dashboard","⌂","Dashboard"],["lancamentos","☷","Lançamentos"],["faturas","▣","Importar Fatura"],
 ["fixas","▤","Contas Fixas"],["parcelas","◴","Parcelas"],["relatorios","▥","Relatórios"],
 ["risco","⚠","Análise de Risco"],["sugestoes","✧","Sugestões"],["config","⚙","Configurações"]
];
const $=id=>document.getElementById(id);
const money=v=>"R$ "+Number(v||0).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
const num=v=>Number(v||0);
const uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);

function normalize(){
 if(!D.categories)D.categories=["Saúde","Transporte","Alimentação/Despesas da Casa","Lazer","Vestuário","Educação","Moradia/Contas Fixas","Assinaturas","Compras/Casa","Outros"];
 if(!D.cards)D.cards=[];
 if(!D.card_payments)D.card_payments={};
 if(!D.income_sources)D.income_sources=[{id:"r1",descricao:"Salário fixo",valor:num(D.salary||0),tipo:"Fixa",ativa:true}];
 if(!D.control_start)D.control_start="2026-09";
 D.fixed=(D.fixed||[]).map((x,i)=>({...x,id:x.id||("f"+i+"_"+uid()),ativa:x.ativa!==false}));
 D.transactions=(D.transactions||[]).map(x=>{
   let d=x.data?parseDateRaw(x.data):null;
   let comp=x.competencia|| (d?`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`:"");
   return {...x,id:x.id||uid(),competencia:comp}
 });
}
async function load(){
 try{D=JSON.parse(localStorage.getItem("controle_financeiro_v16")||"null")||structuredClone(DEFAULT_DATA)}catch(e){D=structuredClone(DEFAULT_DATA)}
 normalize();const now=new Date();selectedMonth=now.getMonth()+1;selectedYear=now.getFullYear();renderAll()
}
async function save(){localStorage.setItem("controle_financeiro_v16",JSON.stringify(D));return true}

function parseDateRaw(s){
 if(!s)return null;
 let d=new Date(s+"T12:00:00");
 if(!isNaN(d))return d;
 let m=String(s).match(/^(\d{2})\/(\d{2})\/?(\d{4})?$/);
 if(m)return new Date(Number(m[3]||selectedYear),Number(m[2])-1,Number(m[1]),12);
 return null;
}
function parseDate(s){return parseDateRaw(s)}
function txFor(y,m){
 const comp=`${y}-${String(m).padStart(2,"0")}`;
 return D.transactions.filter(x=>{
   if(x.competencia)return x.competencia===comp;
   let d=parseDate(x.data);return d&&d.getFullYear()==y&&d.getMonth()+1==m
 })
}
function fixedTotal(){return D.fixed.filter(x=>x.ativa!==false).reduce((s,x)=>s+num(x.valor),0)}
function incomeTotal(){
 let list=(D.income_sources||[]).filter(x=>x.ativa!==false);
 return list.reduce((s,x)=>s+num(x.valor),0);
}
function incomeBreakdown(){
 return (D.income_sources||[]).filter(x=>x.ativa!==false);
}
function monthKey(y,m){return `${y}-${String(m).padStart(2,"0")}`}
function isBeforeControl(y,m){return monthKey(y,m) < (D.control_start||"2026-09")}
function normalizeInstallmentKey(x){
 let d=String(x.descricao||"").toUpperCase()
   .replace(/\b\d{1,2}\s*\/\s*\d{1,2}\b/g,"")
   .replace(/\s+/g," ").trim();
 return [String(x.cartao||""),d,Number(x.valor||0).toFixed(2)].join("|");
}
function monthsBetween(compA, y, m){
 if(!compA)return null;
 let [ay,am]=compA.split("-").map(Number);
 if(!ay||!am)return null;
 return (y-ay)*12+(m-am);
}
function projectedInstallmentsFor(y,m){
 if(isBeforeControl(y,m)) return [];
 const target=monthKey(y,m);
 const actual=D.transactions.filter(x=>x.competencia===target);
 const actualKeys=new Set(actual.filter(x=>num(x.total_parcelas)>0).map(normalizeInstallmentKey));

 // Group known installment records by purchase key and keep the latest known competence at/before target.
 const groups={};
 D.transactions.filter(x=>num(x.total_parcelas)>0 && x.competencia && x.competencia<=target).forEach(x=>{
   const k=normalizeInstallmentKey(x);
   if(!groups[k] || String(x.competencia)>String(groups[k].competencia)) groups[k]=x;
 });

 const out=[];
 Object.entries(groups).forEach(([k,x])=>{
   if(actualKeys.has(k)) return; // actual imported installment already exists for target competence
   const delta=monthsBetween(x.competencia,y,m);
   if(delta===null || delta<0) return;
   const pa=num(x.parcela_atual), tp=num(x.total_parcelas), vp=pa+delta;
   if(vp>=1 && vp<=tp){
     out.push({
       id:"proj_"+k+"_"+target,
       data:"",
       competencia:target,
       descricao:x.descricao,
       valor:num(x.valor),
       categoria:x.categoria,
       cartao:x.cartao,
       parcela_atual:vp,
       total_parcelas:tp,
       tipo:"Parcela projetada",
       observacao:"Projeção automática",
       projected:true
     });
   }
 });
 return out;
}


function prevYM(y,m){return m===1?[y-1,12]:[y,m-1]}
function monthTotals(y,m){
 if(isBeforeControl(y,m)){
   return {tx:[],actualTx:[],projected:[],variable:0,fixed:0,total:0,income:0,balance:0,cats:{},cards:{}};
 }
 let actualTx=txFor(y,m);
 let projected=projectedInstallmentsFor(y,m);
 let tx=[...actualTx,...projected];
 let variable=tx.reduce((s,x)=>s+num(x.valor),0), fixed=fixedTotal(), income=incomeTotal();
 let cats={};tx.forEach(x=>cats[x.categoria]=(cats[x.categoria]||0)+num(x.valor));
 let cards={};tx.forEach(x=>cards[x.cartao||"Outros"]=(cards[x.cartao||"Outros"]||0)+num(x.valor));
 return {tx,actualTx,projected,variable,fixed,total:variable+fixed,income,balance:income-variable-fixed,cats,cards}
}
function pctChange(a,b){if(!b)return a?100:0;return (a-b)/Math.abs(b)*100}
function compHtml(cur,prev,invert=false){
 let p=pctChange(cur,prev), good=invert?p<0:p>0, cls=p===0?"muted":good?"pos":"neg", arrow=p>0?"▲":p<0?"▼":"•";
 return `<div class="kpiCompare ${cls}">${arrow} ${Math.abs(p).toFixed(1)}% vs mês anterior</div>`
}
function optionMonths(){return MONTHS.map((x,i)=>`<option value="${i+1}" ${selectedMonth==i+1?"selected":""}>${x}</option>`).join("")}
function optionYears(){
 let years=new Set([2025,2026,2027,new Date().getFullYear()]);
 D.transactions.forEach(x=>{let d=parseDate(x.data);if(d)years.add(d.getFullYear())});
 return [...years].sort().map(y=>`<option ${selectedYear==y?"selected":""}>${y}</option>`).join("")
}
function globalFilter(){
 return `<div class="controls"><select id="monthSel" onchange="setPeriod()">${optionMonths()}</select><select id="yearSel" onchange="setPeriod()">${optionYears()}</select></div>`
}
function setPeriod(){
 let ms=document.querySelectorAll("#monthSel"), ys=document.querySelectorAll("#yearSel");
 let mEl=[...ms].find(x=>x.offsetParent!==null)||ms[0], yEl=[...ys].find(x=>x.offsetParent!==null)||ys[0];
 if(mEl)selectedMonth=num(mEl.value);if(yEl)selectedYear=num(yEl.value);
 renderAll();
}

function renderNav(){
 $("nav").innerHTML=PAGES.map(p=>`<button class="${currentPage==p[0]?"active":""}" onclick="showPage('${p[0]}')">${p[1]} &nbsp;${p[2]}</button>`).join("")
}
function showPage(p){currentPage=p;document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));$(p+"Page").classList.add("active");renderNav();renderAll()}

function donutStyle(cats){
 let vals=Object.values(cats),sum=vals.reduce((a,b)=>a+b,0);if(!sum)return "background:#193047";
 let start=0,parts=[];Object.entries(cats).forEach(([k,v],i)=>{let end=start+v/sum*100;parts.push(`${COLORS[i%COLORS.length]} ${start}% ${end}%`);start=end});
 return `background:conic-gradient(${parts.join(",")})`
}
function legendHtml(cats){
 let sum=Object.values(cats).reduce((a,b)=>a+b,0);
 return Object.entries(cats).sort((a,b)=>b[1]-a[1]).map(([k,v],i)=>`<div class="legendRow"><span><i class="dot" style="background:${COLORS[i%COLORS.length]}"></i>${k}</span><span>${sum?(v/sum*100).toFixed(1):0}%</span><b>${money(v)}</b></div>`).join("")
}
function categoryBars(cats){
 let entries=Object.entries(cats).sort((a,b)=>b[1]-a[1]),mx=Math.max(1,...entries.map(x=>x[1]));
 return entries.map(([k,v],i)=>`<div class="catBarRow"><div><div class="catBarName"><span>${k}</span><span>${(v/Object.values(cats).reduce((a,b)=>a+b,0)*100).toFixed(1)}%</span></div><div class="catBarTrack"><div class="catBarFill" style="width:${v/mx*100}%;background:${COLORS[i%COLORS.length]}"></div></div></div><b>${money(v)}</b></div>`).join("")
}
function historySeries(y,m,n=6){
 let out=[];
 for(let i=n-1;i>=0;i--){
   let d=new Date(y,m-1-i,1), ty=d.getFullYear(),tm=d.getMonth()+1;
   if(isBeforeControl(ty,tm)){
     out.push({label:MONTHS[tm-1],y:ty,m:tm,expense:0,income:0});
   }else{
     let T=monthTotals(ty,tm);
     out.push({label:MONTHS[tm-1],y:ty,m:tm,expense:T.total,income:T.income});
   }
 }
 return out
}
function lineSvg(series){
 let W=520,H=200,p=28,max=Math.max(1,...series.flatMap(x=>[x.expense,x.income]));
 let pts=(key)=>series.map((x,i)=>`${p+i*(W-2*p)/Math.max(1,series.length-1)},${H-p-x[key]/max*(H-2*p)}`).join(" ");
 let circles=(key,cls)=>series.map((x,i)=>{let cx=p+i*(W-2*p)/Math.max(1,series.length-1),cy=H-p-x[key]/max*(H-2*p);return `<circle class="${cls}" cx="${cx}" cy="${cy}" r="3"/>`}).join("");
 return `<div class="chart"><svg viewBox="0 0 ${W} ${H}">
   <line class="axis" x1="${p}" y1="${H-p}" x2="${W-p}" y2="${H-p}"/><line class="axis" x1="${p}" y1="${p}" x2="${p}" y2="${H-p}"/>
   <polyline class="line" points="${pts("income")}"/>${circles("income","point")}
   <polyline class="expenseLine" points="${pts("expense")}"/>${circles("expense","expensePoint")}
   ${series.map((x,i)=>`<text x="${p+i*(W-2*p)/Math.max(1,series.length-1)}" y="${H-8}" fill="#8fa5b8" font-size="10" text-anchor="middle">${x.label}</text>`).join("")}

function normalizeStatementText(text){

   .replace(/\r/g,"\n")
   .replace(/(\d{1,2})\s*\n\s*\/\s*(\d{1,2})/g,"$1/$2")

function ptMonthNumber(v){
 const m={JAN:1,FEV:2,MAR:3,ABR:4,MAI:5,JUN:6,JUL:7,AGO:8,SET:9,OUT:10,NOV:11,DEZ:12};

function parseBradescoVisual(text,meta){
 if(meta.bank!=="Bradesco"&&!/BRADESCO/i.test(text))return [];
 const lines=String(text||"").split(/\n+/).map(x=>x.replace(/\s+/g," ").trim()).filter(Boolean);
 const statementYear=meta.statementDate?+meta.statementDate.slice(0,4):(String(text).match(/Data\s+(?:da\s+)?(?:Fatura\s+)?(\d{2})\/(\d{2})\/(\d{4})/i)||[])[3]*1||new Date().getFullYear();
 let currentDay=0,currentMonth=0,currentCard="",rows=[],seen=new Set(),pendingDay=0;
 const ignore=/^(?:Data|Lançamentos|Moeda de Origem|Valor \(US\$\)|Cotação|Valor \(R\$\)|Resumo das Despesas|Taxas Mensais|Pagamento mínimo|Despesas no exterior|\(?[+=-]\)?Total da fatura|Total da fatura|Valor da fatura anterior|Forma de pagamento|Melhor data de compra|Cartao selecionado|Cartão selecionado|Validade|GUSTAVO NASCIMENTO|Fatura$|Real$|---PAGE---)/i;
 for(let i=0;i<lines.length;i++){
   let line=lines[i];
   let cm=line.match(/Gastos referentes ao cartão:\s*Final\s*(\d{4})/i);if(cm){currentCard=cm[1];continue}
   // Alguns PDFs trazem dia e mês na mesma linha; outros em duas linhas.
   let dm=line.match(/^(\d{1,2})\s+(JAN|FEV|MAR|ABR|MAI|JUN|JUL|AGO|SET|OUT|NOV|DEZ)$/i);
   if(dm){currentDay=+dm[1];currentMonth=ptMonthNumber(dm[2]);pendingDay=0;continue}
   if(/^\d{1,2}$/.test(line)){pendingDay=+line;continue}
   if(/^(JAN|FEV|MAR|ABR|MAI|JUN|JUL|AGO|SET|OUT|NOV|DEZ)$/i.test(line)&&pendingDay){currentDay=pendingDay;currentMonth=ptMonthNumber(line);pendingDay=0;continue}
   // Quando PDF.js preserva colunas, a linha pode ser: 27 SET DESCRICAO 9,79
   let inline=line.match(/^(\d{1,2})\s+(JAN|FEV|MAR|ABR|MAI|JUN|JUL|AGO|SET|OUT|NOV|DEZ)\s+(.+?)\s+(-?[\d.]+,\d{2})$/i);
   let desc,val;
   if(inline){currentDay=+inline[1];currentMonth=ptMonthNumber(inline[2]);desc=inline[3];val=brVal(inline[4])}
   else{
     let tr=line.match(/^(.+?)\s+(-?[\d.]+,\d{2})$/);
     if(!tr||!currentDay||!currentMonth||ignore.test(line))continue;
     desc=tr[1].trim();val=brVal(tr[2]);
   }
   if(!desc||!Number.isFinite(val)||val===0)continue;
   if(/Valor da fatura|Saldo anterior|Pagamentos\/Créditos|Despesas locais|Pagamento mínimo|Taxa ao|Parcelamento de fatura|Rotativo|Saque|Crediário/i.test(desc))continue;
   let u=desc.toUpperCase(),nature=/PAG BOLETO|PAGTO|PAGAMENTO|PGTO/.test(u)?"Pagamento":(/SALDO ANTERIOR/.test(u)?"Saldo anterior":(val<0||/ESTORNO|CR[EÉ]DITO|CANCELAMENTO/.test(u)?"Estorno/Crédito":"Compra"));
   let pm=desc.match(/\(\s*(\d{1,2})\s*\/\s*(\d{1,2})\s*\)/)||desc.match(/(?:^|\s)(\d{1,2})\s*\/\s*(\d{1,2})(?:\s|$)/),pa="",tp="";
   if(pm){pa=+pm[1];tp=+pm[2];if(tp<pa||tp>60){pa="";tp=""}}
   let data=`${statementYear}-${String(currentMonth).padStart(2,"0")}-${String(currentDay).padStart(2,"0")}`,competencia=`${statementYear}-${String(currentMonth).padStart(2,"0")}`;
   let key=[data,desc,val,currentCard].join("|");if(seen.has(key))continue;seen.add(key);
   rows.push({data,descricao:desc,valor:Math.abs(val),categoria:classifyImport(desc),cartao:currentCard?`Bradesco •••• ${currentCard}`:"Bradesco",parcela_atual:pa,total_parcelas:tp,tipo:tp?"Parcela":"Variável",observacao:nature,competencia,natureza:nature});
 }

}

function parseStatementText(text,meta){
 let rows=[],seen=new Set(), s=normalizeStatementText(text);
 let fallbackYear=meta.statementDate?Number(meta.statementDate.slice(0,4)):new Date().getFullYear();

 // Bradesco and similar exports: date + description + BRL + origin + US$ + R$ + final BRL amount.
 // Global matching is deliberate: PDF extraction often joins several transactions on one physical line.
 const rx=/(\d{2})\/(\d{2})(?:\/(\d{2,4}))?\s+(.+?)\s+BRL\s+(-?[\d.]+,\d{2})\s+0,00\s+R\$\s+0,00\s+(-?[\d.]+,\d{2})(?=\s+(?:\d{2}\/\d{2}\b|XXXX|\.?\s*Total|Data Histórico|$))/gi;
 let m;
 while((m=rx.exec(s))!==null){
   let dd=+m[1],mm=+m[2],yy=m[3]?+m[3]:fallbackYear;if(yy<100)yy+=2000;
   if(dd<1||dd>31||mm<1||mm>12)continue;
   let desc=m[4].replace(/\s+/g," ").trim();
   let value=brVal(m[6]);
   let u=desc.toUpperCase();
   let nature=/PAGTO|PAGAMENTO|PGTO/.test(u)?"Pagamento":(/SALDO ANTERIOR/.test(u)?"Saldo anterior":(value<0||/ESTORNO|CR[EÉ]DITO|CANCELAMENTO/.test(u)?"Estorno/Crédito":"Compra"));
   let pm=desc.match(/(?:^|\s)(\d{1,2})\s*\/\s*(\d{1,2})(?:\s|$)/),pa="",tp="";
   if(pm){pa=+pm[1];tp=+pm[2];if(tp<pa||tp>60){pa="";tp=""}}
   let data=`${yy}-${String(mm).padStart(2,"0")}-${String(dd).padStart(2,"0")}`;
   let competence=`${yy}-${String(mm).padStart(2,"0")}`;
   let key=[data,desc,value].join("|");if(seen.has(key))continue;seen.add(key);
   rows.push({data,descricao:desc,valor:value,categoria:classifyImport(desc),cartao:meta.bank,parcela_atual:pa,total_parcelas:tp,tipo:tp?"Parcela":"Variável",observacao:nature,competencia:competence,natureza:nature});
 }
 // Fallback for simpler statements without BRL columns.
 if(rows.length<3){
   const simple=/(\d{2})\/(\d{2})(?:\/(\d{2,4}))?\s+(.+?)\s+(?:R\$\s*)?(-?[\d.]+,\d{2})(?=\s+(?:\d{2}\/\d{2}\b|$))/gi;
   while((m=simple.exec(s))!==null){
     let dd=+m[1],mm=+m[2],yy=m[3]?+m[3]:fallbackYear;if(yy<100)yy+=2000;
     let desc=m[4].replace(/\s+/g," ").trim();
     if(/\bBRL\b/.test(desc))continue;
     let value=brVal(m[5]),u=desc.toUpperCase();
     let nature=/PAGTO|PAGAMENTO|PGTO/.test(u)?"Pagamento":(/SALDO ANTERIOR/.test(u)?"Saldo anterior":(value<0||/ESTORNO|CR[EÉ]DITO|CANCELAMENTO/.test(u)?"Estorno/Crédito":"Compra"));
     let pm=desc.match(/(?:^|\s)(\d{1,2})\s*\/\s*(\d{1,2})(?:\s|$)/),pa="",tp="";
     if(pm){pa=+pm[1];tp=+pm[2];if(tp<pa||tp>60){pa="";tp=""}}
     let data=`${yy}-${String(mm).padStart(2,"0")}-${String(dd).padStart(2,"0")}`,competence=`${yy}-${String(mm).padStart(2,"0")}`,key=[data,desc,value].join("|");
     if(seen.has(key)||!value)continue;seen.add(key);
     rows.push({data,descricao:desc,valor:value,categoria:classifyImport(desc),cartao:meta.bank,parcela_atual:pa,total_parcelas:tp,tipo:tp?"Parcela":"Variável",observacao:nature,competencia:competence,natureza:nature});
   }
 }
 return rows.sort((x,y)=>y.data.localeCompare(x.data));
}

function monthNumPt(name){let a={janeiro:1,fevereiro:2,marco:3,"março":3,abril:4,maio:5,junho:6,julho:7,agosto:8,setembro:9,outubro:10,novembro:11,dezembro:12};return a[String(name||"").toLowerCase()]||0}
function excelDateISO(v, fallbackYear){
 if(v instanceof Date&&!isNaN(v))return `${v.getFullYear()}-${String(v.getMonth()+1).padStart(2,"0")}-${String(v.getDate()).padStart(2,"0")}`;
 if(typeof v==="number"&&window.XLSX){let d=XLSX.SSF.parse_date_code(v);if(d)return `${d.y}-${String(d.m).padStart(2,"0")}-${String(d.d).padStart(2,"0")}`}
 let t=String(v||"").trim(),m=t.match(/(\d{1,2})[\/\-](\d{1,2})(?:[\/\-](\d{2,4}))?/);if(!m)return "";let y=m[3]?+m[3]:fallbackYear;if(y<100)y+=2000;return `${y}-${String(+m[2]).padStart(2,"0")}-${String(+m[1]).padStart(2,"0")}`
}
async function extractExcelStatement(file){
 if(!window.XLSX)throw new Error("Biblioteca de leitura do Excel não carregou. Verifique sua conexão e tente novamente.");
 let wb=XLSX.read(await file.arrayBuffer(),{type:"array",cellDates:true});
 let ws=wb.Sheets[wb.SheetNames[0]],aoa=XLSX.utils.sheet_to_json(ws,{header:1,defval:"",raw:true});

 let title=flat.find(x=>/Fatura\s+(?:Aberta|Fechada)\s*-?/i.test(x))||"";
 let tm=title.match(/Fatura\s+(Aberta|Fechada)\s*-?\s*([A-Za-zÀ-ÿ]+)\/(\d{4})/i),status=tm?(tm[1].toLowerCase()==="aberta"?"Em aberto":"Fechada"):"Não identificado";

 let cards=[...new Set(flat.map(x=>{let m=x.match(/(?:final\s*|\*{2,})(\d{4})/i);return m?m[1]:null}).filter(Boolean))];
 let total=null;for(let r=0;r<aoa.length;r++){for(let c=0;c<aoa[r].length;c++){if(/Valor\s*\(parcial\)|Total da fatura/i.test(String(aoa[r][c]))){for(let rr=r;rr<Math.min(r+5,aoa.length);rr++)for(let cc=c;cc<Math.min(c+4,(aoa[rr]||[]).length);cc++){let v=aoa[rr][cc];if(typeof v==="number"&&v>0){total=v;break}}}}}
 let header=-1,cols={};for(let r=0;r<aoa.length;r++){let row=aoa[r].map(x=>String(x).trim().toLowerCase());if(row.includes("data")&&row.includes("lançamento")&&row.includes("valor")){header=r;row.forEach((x,i)=>cols[x]=i);break}}
 if(header<0)throw new Error("Não encontrei a tabela de lançamentos no Excel.");
 let rows=[];for(let r=header+1;r<aoa.length;r++){let row=aoa[r],desc=String(row[cols["lançamento"]]||"").trim();if(!desc||/^subtotal|importante saber/i.test(desc))continue;let val=row[cols["valor"]];val=typeof val==="number"?val:brVal(val);if(!Number.isFinite(val)||val===0)continue;let data=excelDateISO(row[cols["data"]],sy);if(!data)continue;
   let parc=String(row[cols["parcelamento"]]||"").trim(),pm=parc.match(/Parcela\s*(\d+)\s*de\s*(\d+)/i),pa=pm?+pm[1]:"",tp=pm?+pm[2]:"";
   let u=desc.toUpperCase(),nature=/PAGAMENTO|PAGTO|PGTO/.test(u)?"Pagamento":(val<0||/ESTORNO|CR[EÉ]DITO|CANCELAMENTO/.test(u)?"Estorno/Crédito":"Compra");
   rows.push({data,descricao:desc,valor:Math.abs(val),categoria:classifyImport(desc),cartao:bank,parcela_atual:pa,total_parcelas:tp,tipo:tp?"Parcela":"Variável",observacao:nature,competencia:competence||data.slice(0,7),natureza:nature});
 }

}

async function extractPdfText(file){
 let pdfjs=await import('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs');
 pdfjs.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs';
 let buf=await file.arrayBuffer(),pdf=await pdfjs.getDocument({data:buf}).promise,text="";
 // Mantém as linhas visuais do PDF. Isso é essencial em faturas Bradesco,
 // nas quais dia/mês, descrição e valor podem vir em objetos de texto separados.
 for(let i=1;i<=pdf.numPages;i++){
   let p=await pdf.getPage(i),c=await p.getTextContent(),lines=[];
   for(const it of c.items){
     const y=Math.round((it.transform?.[5]||0)*2)/2, x=it.transform?.[4]||0;
     let line=lines.find(z=>Math.abs(z.y-y)<=2);
     if(!line){line={y,items:[]};lines.push(line)}
     line.items.push({x,str:String(it.str||"").trim()});
   }
   lines.sort((a,b)=>b.y-a.y);
   text+=lines.map(l=>l.items.sort((a,b)=>a.x-b.x).map(q=>q.str).filter(Boolean).join(" ")).filter(Boolean).join("\n")+"\n---PAGE---\n";
 }
 if(text.replace(/\s/g,"").length>80)return text;
 text="";
 for(let i=1;i<=pdf.numPages;i++){ $("pdfResult").innerHTML=`<div class="msg">PDF digitalizado: lendo página ${i} de ${pdf.numPages} por imagem...</div>`;let p=await pdf.getPage(i),vp=p.getViewport({scale:1.8}),cv=document.createElement('canvas');cv.width=vp.width;cv.height=vp.height;await p.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;let r=await Tesseract.recognize(cv,'por');text+=r.data.text+'\n---PAGE---\n'}
 return text;
}
async function extractImageText(file){let r=await Tesseract.recognize(file,'por',{logger:m=>{if(m.status&&m.progress!==undefined)$("pdfResult").innerHTML=`<div class="msg">Leitura visual: ${m.status} ${Math.round(m.progress*100)}%</div>`}});return r.data.text}

   let text="";if(f.type==="application/pdf"||name.endsWith(".pdf"))text=await extractPdfText(f);else if(f.type.startsWith("image/")||/\.(png|jpe?g)$/i.test(name))text=await extractImageText(f);else throw new Error("Formato não suportado. Use Excel (.xlsx/.xls), PDF, JPG, JPEG ou PNG.");

 let rows=[...actual,...proj];
 if(!rows.length)return `<div class="empty">Nenhuma parcela comprometida neste mês.</div>`;
 return `<div class="scroll"><table><thead><tr><th>Descrição</th><th>Parcela</th><th>Restantes</th><th>Valor</th></tr></thead><tbody>${rows.slice(0,limit).map(x=>`<tr><td>${x.descricao}</td><td>${x.parcela_atual}/${x.total_parcelas}</td><td>${Math.max(0,num(x.total_parcelas)-num(x.parcela_atual))}</td><td>${money(x.valor)}</td></tr>`).join("")}</tbody></table></div>`
}
function parcelasR(){
 const base=new Date(selectedYear,selectedMonth-1,1);
 let months=[];
 for(let ahead=0;ahead<=12;ahead++){
   let d=new Date(base.getFullYear(),base.getMonth()+ahead,1), y=d.getFullYear(),m=d.getMonth()+1;
   let actual=txFor(y,m).filter(x=>num(x.total_parcelas)>0);
   let proj=projectedInstallmentsFor(y,m);
   let combined=[...actual,...proj];
   months.push({label:`${MONTHS[d.getMonth()]}/${y}`,y,m,rows:combined,total:combined.reduce((s,x)=>s+num(x.valor),0)});
 }
 let current=months[0];
 $("parcelasPage").innerHTML=`<div class="topbar"><div><h1 class="sectionTitle">Parcelas Futuras</h1><div class="muted">As parcelas abaixo também são abatidas automaticamente do saldo dos meses futuros.</div></div>${globalFilter()}</div>
 <div class="grid2"><div class="card"><div class="rowTitle"><h3>Parcelas em ${current.label}</h3><b>${money(current.total)}</b></div>
 ${current.rows.length?`<div class="scroll"><table><thead><tr><th>Descrição</th><th>Cartão</th><th>Parcela</th><th>Restantes</th><th>Valor</th><th>Status</th></tr></thead><tbody>${current.rows.map(x=>`<tr><td>${x.descricao}</td><td>${x.cartao||"—"}</td><td>${x.parcela_atual}/${x.total_parcelas}</td><td>${Math.max(0,num(x.total_parcelas)-num(x.parcela_atual))}</td><td>${money(x.valor)}</td><td><span class="smallBadge">${x.projected?"Projetada":"Lançada"}</span></td></tr>`).join("")}</tbody></table></div>`:`<div class="empty">Nenhuma parcela comprometida nesta competência.</div>`}</div>
 <div class="card"><h3>Comprometimento futuro</h3>${months.slice(1).map(x=>`<div class="rowTitle" style="padding:8px 0;border-bottom:1px solid #1d3448"><span>${x.label}</span><b>${money(x.total)}</b></div>`).join("")}</div></div>`
}
function relatoriosR(){
 let hist=historySeries(selectedYear,selectedMonth,12);
 $("relatoriosPage").innerHTML=`<div class="topbar"><h1 class="sectionTitle">Comparação entre Meses</h1>${globalFilter()}</div><div class="card"><h3>Evolução de 12 meses</h3><div class="sub">Períodos anteriores a ${D.control_start||"2026-09"} ficam zerados. Meses futuros já incluem as parcelas vigentes projetadas automaticamente.</div>${lineSvg(hist)}</div><div class="card" style="margin-top:13px"><table><thead><tr><th>Mês</th><th>Renda</th><th>Fixos</th><th>Variáveis/Cartões</th><th>Total</th><th>Saldo</th><th>% Renda</th></tr></thead><tbody>${hist.map(h=>{if(isBeforeControl(h.y,h.m))return `<tr><td>${h.label}/${h.y}</td><td>R$ 0,00</td><td>R$ 0,00</td><td>R$ 0,00</td><td>R$ 0,00</td><td>R$ 0,00</td><td>0,0%</td></tr>`;let T=monthTotals(h.y,h.m);return `<tr><td>${h.label}/${h.y}</td><td>${money(T.income)}</td><td>${money(T.fixed)}</td><td>${money(T.variable)}</td><td>${money(T.total)}</td><td class="${T.balance<0?"neg":"pos"}">${money(T.balance)}</td><td>${T.income?(T.total/T.income*100).toFixed(1):0}%</td></tr>`}).join("")}</tbody></table></div>`
}
function riscoR(){
 let C=monthTotals(selectedYear,selectedMonth),[py,pm]=prevYM(selectedYear,selectedMonth),P=monthTotals(py,pm),r=C.income>0?C.total/C.income:0;
 $("riscoPage").innerHTML=`<div class="topbar"><h1 class="sectionTitle">Análise de Risco</h1>${globalFilter()}</div><div class="cards4"><div class="card"><div class="label">Comprometimento</div><div class="value ${C.income<=0?"warn":r>=.8?"neg":r>=.6?"warn":"pos"}">${C.income>0?`${(r*100).toFixed(1)}%`:"—"}</div></div><div class="card"><div class="label">Fixos / renda</div><div class="value">${C.income>0?`${(C.fixed/C.income*100).toFixed(1)}%`:"—"}</div></div><div class="card"><div class="label">Variáveis / renda</div><div class="value">${C.income>0?`${(C.variable/C.income*100).toFixed(1)}%`:"—"}</div></div><div class="card"><div class="label">Saldo projetado</div><div class="value ${C.balance<0?"neg":"pos"}">${money(C.balance)}</div></div></div><div class="grid2"><div class="card"><h3>Diagnóstico</h3><div class="msg ${r>=.8?"red":r>=.6?"yellow":"green"}">${riskAdvice(C,r)}</div><div class="msg">Variação de despesas vs mês anterior: <b>${pctChange(C.total,P.total).toFixed(1)}%</b>.</div></div><div class="card"><h3>Pontos de atenção</h3>${suggestions(C,P).map(x=>`<div class="msg">${x}</div>`).join("")}</div></div>`
}
function sugestoesR(){let C=monthTotals(selectedYear,selectedMonth),[py,pm]=prevYM(selectedYear,selectedMonth),P=monthTotals(py,pm);$("sugestoesPage").innerHTML=`<div class="topbar"><h1 class="sectionTitle">Sugestões</h1>${globalFilter()}</div><div class="card">${suggestions(C,P).map(x=>`<div class="msg">${x}</div>`).join("")}<div class="msg yellow">A renda do imóvel continua fora da renda-base; quando entrar, pode ser tratada como reserva/adicional.</div></div>`}

function configR(){
 $("configPage").innerHTML=`<h1 class="sectionTitle">Configurações</h1><div class="grid2">
 <div class="card"><h3>Rendas</h3>
 <div class="msg">Cadastre salário, aluguel e outras rendas. O painel soma apenas as rendas ativas.</div>
 <div class="incomeList">${D.income_sources.map((r,i)=>`<div class="incomeItem"><input value="${esc(r.descricao)}" onchange="D.income_sources[${i}].descricao=this.value"><input type="number" step=".01" value="${r.valor}" onchange="D.income_sources[${i}].valor=+this.value"><select onchange="D.income_sources[${i}].tipo=this.value"><option ${r.tipo=="Fixa"?"selected":""}>Fixa</option><option ${r.tipo=="Variável"?"selected":""}>Variável</option></select><select onchange="D.income_sources[${i}].ativa=this.value=='true'"><option value="true" ${r.ativa!==false?"selected":""}>Ativa</option><option value="false" ${r.ativa===false?"selected":""}>Inativa</option></select></div>`).join("")}</div>
 <div class="actions" style="margin-top:10px"><button class="btn green" onclick="addIncome()">+ Adicionar renda</button><button class="btn" onclick="saveIncome()">Salvar rendas</button></div>
 <h3 style="margin-top:20px">Início do controle financeiro</h3><div class="formgrid"><input id="controlStart" type="month" value="${D.control_start||"2026-09"}"><button class="btn" onclick="saveControlStart()">Salvar início</button></div>
 <h3 style="margin-top:22px">Cartões</h3><div id="cardsCfg">${D.cards.map((c,i)=>`<div class="msg"><div class="formgrid"><input value="${esc(c.nome)}" onchange="D.cards[${i}].nome=this.value"><input type="number" value="${c.limite}" onchange="D.cards[${i}].limite=+this.value"><input type="number" value="${c.fechamento}" onchange="D.cards[${i}].fechamento=+this.value"><button class="btn red" onclick="delCard(${i})">Excluir</button></div></div>`).join("")}</div><div class="actions"><button class="btn ghost" onclick="addCard()">+ Adicionar cartão</button><button class="btn" onclick="save().then(()=>alert('Configurações dos cartões salvas.'))">Salvar cartões</button></div></div>
 <div class="card"><h3>Categorias</h3><div class="formgrid"><input id="newCat" placeholder="Nova categoria"><button class="btn green" onclick="addCategory()">Cadastrar categoria</button></div><div style="margin-top:12px">${D.categories.map((c,i)=>`<div class="msg"><div class="rowTitle"><span>${c}</span><div class="actions"><button class="btn ghost" onclick="renameCategory(${i})">Renomear</button><button class="btn red" onclick="delCategory(${i})">Excluir</button></div></div></div>`).join("")}</div></div></div>
 <div class="grid2" style="margin-top:13px"><div class="card"><h3>Regras automáticas de classificação</h3><div class="formgrid"><input id="ruleKey" placeholder="Estabelecimento contém"><select id="ruleCat">${catOptions()}</select><button class="btn green" onclick="addRule()">Adicionar regra</button></div><div class="scroll" style="max-height:320px;margin-top:10px"><table>${Object.entries(D.rules||{}).map(([k,v])=>`<tr><td>${k}</td><td>${v}</td><td><button class="btn red" onclick="delRule('${escJs(k)}')">Excluir</button></td></tr>`).join("")}</table></div></div>
 <div class="card"><h3>Backup / Segurança dos dados</h3><div class="msg">Use o backup para não perder seus dados ao trocar de versão.</div><button class="btn" onclick="exportBackup()">Exportar backup JSON</button><br><br><input id="backupFile" type="file" accept=".json"><button class="btn ghost" style="margin-top:8px" onclick="importBackup()">Importar backup</button></div></div>`
}

function addIncome(){D.income_sources.push({id:uid(),descricao:"Nova renda",valor:0,tipo:"Variável",ativa:true});renderAll()}
async function saveIncome(){
 let sal=D.income_sources.find(x=>x.descricao.toLowerCase().includes("salário")||x.descricao.toLowerCase().includes("salario"));
 D.salary=sal?num(sal.valor):0;
 await save();
 renderAll();
 alert("Rendas salvas.");
}
async function saveControlStart(){D.control_start=$("controlStart").value||"2026-09";await save();renderAll();alert("Início do controle atualizado.")}
async function addCategory(){let c=$("newCat").value.trim();if(!c)return;if(D.categories.includes(c))return alert("Categoria já existe.");D.categories.push(c);await save();renderAll()}
async function renameCategory(i){let old=D.categories[i],n=prompt("Novo nome da categoria:",old);if(!n||n==old)return;D.categories[i]=n;D.transactions.forEach(x=>{if(x.categoria==old)x.categoria=n});D.fixed.forEach(x=>{if(x.categoria==old)x.categoria=n});Object.keys(D.rules).forEach(k=>{if(D.rules[k]==old)D.rules[k]=n});await save();renderAll()}
async function delCategory(i){let c=D.categories[i];if(D.transactions.some(x=>x.categoria==c)||D.fixed.some(x=>x.categoria==c))return alert("Há lançamentos ou contas fixas usando esta categoria. Renomeie-a ou altere os registros antes de excluir.");if(confirm(`Excluir categoria "${c}"?`)){D.categories.splice(i,1);await save();renderAll()}}
async function addRule(){let k=$("ruleKey").value.trim().toUpperCase();if(!k)return;D.rules[k]=$("ruleCat").value;await save();renderAll()}
async function delRule(k){delete D.rules[k];await save();renderAll()}
function addCard(){D.cards.push({nome:"Novo cartão",limite:0,fechamento:1,vencimento:10});save().then(renderAll)}
function delCard(i){if(confirm("Excluir cartão da configuração? Os lançamentos existentes serão mantidos.")){D.cards.splice(i,1);save().then(renderAll)}}
function exportBackup(){let blob=new Blob([JSON.stringify(D,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`reis_finance_backup_${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(a.href)}
async function importBackup(){let f=$("backupFile").files[0];if(!f)return alert("Selecione um backup JSON.");try{let obj=JSON.parse(await f.text());D=obj;normalize();await save();renderAll();alert("Backup importado.")}catch(e){alert("Backup inválido: "+e.message)}}

function openModal(html){$("modalBox").innerHTML=html;$("modal").classList.add("open")}
function closeModal(){$("modal").classList.remove("open")}
function esc(s){return String(s??"").replaceAll("&","&amp;").replaceAll('"',"&quot;").replaceAll("<","&lt;").replaceAll(">","&gt;")}
function escJs(s){return String(s).replaceAll("\\","\\\\").replaceAll("'","\\'")}

function renderAll(){
 if(!D)return;normalize();renderNav();dashboardR();lancamentosR();faturasR();fixasR();parcelasR();relatoriosR();riscoR();sugestoesR();configR();
 document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));$(currentPage+"Page").classList.add("active")
}
load()
</script>

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(err => console.warn('SW:', err));
  });
}
</script>
